# Local dev database (H2 file) — keeps folders, students, and uploads across restarts.
# To reset everything intentionally, stop the backend and delete the backend/data folder.
spring.datasource.url=jdbc:h2:file:./data/aucaarchive-local
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
